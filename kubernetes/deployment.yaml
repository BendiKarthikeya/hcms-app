apiVersion: apps/v1
kind: Deployment
metadata:
  name: fits-hcms
  namespace: default
  labels:
    app: fits-hcms
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fits-hcms
  template:
    metadata:
      labels:
        app: fits-hcms
    spec:
      containers:
      - name: fits-hcms
        image: fits-hcms:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fits-hcms-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fits-hcms-secrets
              key: secret-key
        - name: DEBUG
          value: "False"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: regcred