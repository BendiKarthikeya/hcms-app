{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>{% trans "Apply" %} – {{ job.title }}</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f9fafb;color:#111827}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:28px}
h2{margin-top:0}
label{font-size:12px;color:#6b7280;display:block;margin-top:12px}
input,textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;margin-top:3px;box-sizing:border-box}
.btn{margin-top:20px;padding:10px 20px;background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px}
.section-header{margin-top:24px;margin-bottom:4px;font-size:13px;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb;padding-bottom:6px}
.optional-tag{font-size:10px;color:#9ca3af;font-weight:400;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>{% trans "Apply for" %}: {{ job.title|default:job.job_position_id }}</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="section-header">{% trans "Personal Information" %}</div>
      <label>{% trans "Full Name" %} *</label><input type="text" name="name" required>
      <label>{% trans "Email" %} *</label><input type="email" name="email" required>
      <label>{% trans "Mobile" %}<span class="optional-tag">{% trans "optional" %}</span></label><input type="text" name="mobile">

      <div class="section-header">{% trans "Documents" %}</div>
      <label>{% trans "Resume / CV (PDF)" %} *</label>
      <input type="file" name="resume" accept=".pdf" required>

      <label>{% trans "Cover Letter (PDF)" %}<span class="optional-tag">{% trans "optional" %}</span></label>
      <input type="file" name="cover_letter" accept=".pdf">

      <label>{% trans "Graduation Certificate (PDF)" %}<span class="optional-tag">{% trans "optional" %}</span></label>
      <input type="file" name="graduation_certificate" accept=".pdf">

      <label>{% trans "Transcripts (PDF)" %}<span class="optional-tag">{% trans "optional" %}</span></label>
      <input type="file" name="transcripts" accept=".pdf">

      <button type="submit" class="btn">{% trans "Submit Application" %}</button>
    </form>
  </div>
</div>
</body></html>
