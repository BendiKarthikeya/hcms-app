{% load i18n static %}
{# Shared CSS + helper bits used by both PDF-faithful proposal templates. #}
<style>
  .ep-doc { max-width:850px; margin:24px auto; background:#fff; padding:32px; border:1px solid #e5e7eb; border-radius:8px; font-family:"Times New Roman", Georgia, serif; color:#111; }
  .ep-doc h2 { text-align:center; font-size:18px; font-weight:700; margin:0 0 4px; }
  .ep-doc .ep-sub { text-align:center; font-size:14px; font-weight:700; margin-bottom:14px; }
  .ep-doc .ep-sec-title { background:#e5e7eb; text-align:center; font-weight:700; font-size:13px; padding:5px; border:1px solid #9ca3af; }
  .ep-doc table.ep-tbl { width:100%; border-collapse:collapse; margin-bottom:0; }
  .ep-doc table.ep-tbl td { border:1px solid #9ca3af; padding:5px 7px; font-size:12px; vertical-align:top; }
  .ep-doc table.ep-tbl td.lbl { background:#f9fafb; font-weight:600; width:30%; }
  .ep-doc .ep-check { font-size:13px; }
  .ep-doc .ep-check-on::before { content:"☑ "; }
  .ep-doc .ep-check-off::before { content:"☐ "; }
  .ep-doc .ep-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
  .ep-doc .ep-pill-active   { background:#dcfce7; color:#166534; }
  .ep-doc .ep-pill-waiting  { background:#f3f4f6; color:#6b7280; }
  .ep-doc .ep-pill-approved { background:#dbeafe; color:#1d4ed8; }
  .ep-doc .ep-pill-rejected { background:#fef3c7; color:#b45309; }
  .ep-doc .ep-sign-box { border:1px solid #9ca3af; padding:8px 12px; min-height:70px; display:flex; flex-direction:column; gap:6px; }
  .ep-doc .ep-sign-box img { max-width:160px; max-height:55px; display:block; }
  .ep-doc .ep-toolbar { display:flex; gap:8px; justify-content:flex-end; margin-bottom:14px; font-family:system-ui, -apple-system, sans-serif; }
  .ep-doc .ep-btn { padding:8px 16px; border-radius:6px; font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; border:none; }
  .ep-doc .ep-btn-green { background:#16a34a; color:#fff; }
  .ep-doc .ep-btn-red { background:#dc2626; color:#fff; }
  .ep-doc .ep-btn-blue { background:#2563eb; color:#fff; }
  .ep-doc .ep-btn-grey { background:#f3f4f6; color:#374151; border:1px solid #d1d5db; }
</style>
