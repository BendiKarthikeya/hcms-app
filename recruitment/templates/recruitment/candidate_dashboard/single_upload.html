{% extends "index.html" %}
{% load i18n %}

{% block title %}{% trans "Upload CV" %}{% endblock %}

{% block content %}
<main :class="sidebarOpen ? 'oh-main__sidebar-visible' : ''">
<div class="oh-wrapper">
<div style="max-width:640px; margin:32px auto; padding:16px;">
    <div style="background:#fff; border:1px solid hsl(213,22%,93%); border-radius:8px; padding:20px;">
        <h2 style="margin-top:0;">{% trans "Single CV Upload" %}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <a href="{% url 'candidate-dashboard' %}" style="padding:8px 14px; border-radius:6px; background:#e5e7eb; color:#111827; text-decoration:none;">{% trans "Cancel" %}</a>
                <button type="submit" style="padding:8px 14px; border-radius:6px; background:#16a34a; color:#fff; border:none; cursor:pointer;">{% trans "Create Candidate" %}</button>
            </div>
        </form>
    </div>
</div>
</div>
</main>
{% endblock %}
