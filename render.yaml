services:
  - type: web
    name: fits-backend
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn fits.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: fits-db
          property: connectionString

databases:
  - name: fits-db
    databaseName: fits
    user: postgres
