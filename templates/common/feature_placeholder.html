{% extends 'index.html' %}
{% load i18n %}

{% block content %}
<main :class="sidebarOpen ? 'oh-main__sidebar-visible' : ''">
    <div class="oh-wrapper">
        <div class="oh-dashboard row" id="dashboard">
            <div class="oh-dashboard__left col-12 col-sm-12 col-md-12 col-lg-12">
                <div class="oh-dashboard__cards row">
                    <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                        <div class="oh-card-dashboard oh-card-dashboard--neutral oh-card-dashboard--no-scale">
                            <div class="oh-card-dashboard__header">
                                <span class="oh-card-dashboard__title">{% trans "Module" %}</span>
                            </div>
                            <div class="oh-card-dashboard__body">
                                <span class="oh-card-dashboard__count">{{ module_name }}</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                        <div class="oh-card-dashboard oh-card-dashboard--warning oh-card-dashboard--no-scale">
                            <div class="oh-card-dashboard__header">
                                <span class="oh-card-dashboard__title">{% trans "Feature" %}</span>
                            </div>
                            <div class="oh-card-dashboard__body">
                                <span class="oh-card-dashboard__count">{{ feature_name }}</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-12 col-md-4 col-lg-4">
                        <div class="oh-card-dashboard oh-card-dashboard--success oh-card-dashboard--no-scale">
                            <div class="oh-card-dashboard__header">
                                <span class="oh-card-dashboard__title">{% trans "Status" %}</span>
                            </div>
                            <div class="oh-card-dashboard__body">
                                <span class="oh-card-dashboard__count">{% trans "In Progress" %}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="oh-card mt-4 p-4">
                    <h3 class="oh-main__titlebar-title mb-2">{{ page_title }}</h3>
                    <p class="mb-3">{{ feature_note }}</p>
                    <div class="d-flex gap-2 flex-wrap">
                        <a href="/" class="oh-btn oh-btn--secondary">{% trans "Go to Dashboard" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
